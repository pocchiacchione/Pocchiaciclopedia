<script>
(function () {
  var gl = document.querySelectorAll('[data-glitch]'), D = '0123456789', X = '?#%&';
  function g(n) { var s = ''; for (var i = 0; i < n; i++) s += Math.random() < .14 ? X.charAt(Math.floor(Math.random() * X.length)) : D.charAt(Math.floor(Math.random() * 10)); return s; }
  function tick() { for (var i = 0; i < gl.length; i++) gl[i].textContent = g(+gl[i].getAttribute('data-glitch')); }

  var slow = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setInterval(tick, slow ? 1600 : 120);
})();

<!DOCTYPE html>

<head>

<script>
try { if (localStorage.getItem('pocchia-cestino') !== 'true') location.replace('../index.html'); } catch (e) {}
</script>
<style>
:root { --bg:#000; --g:#33ff33; --gd:#1f9e1f; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { color: var(--g); font: 11px/2.3 'Press Start 2P', Monaco, 'Courier New', monospace; min-height: 100vh; }
main { max-width: 780px; margin: 0 auto; padding: 28px 18px 40vh; }
a { color: inherit; text-decoration: none; }
.dim { color: var(--gd); }
.top a:hover { text-decoration: underline; }
.cmd { margin: 26px 0 6px; }
.cmd .p { color: var(--gd); }
.out { margin: 4px 0 4px 0; font-size: 9px; color: var(--gd); }
.f { display: flex; gap: 14px; align-items: baseline; padding: 6px 10px; border-left: 3px solid var(--gd); margin: 6px 0; }
.f .n { flex: 1; word-break: break-all; }
.f .s { font-size: 9px; color: var(--gd); }
.f.locked { opacity: .5; cursor: default; }
.f:not(.locked):hover, .f:not(.locked):focus { background: var(--g); color: #000; outline: 0; }
.f:not(.locked):hover .s { color: #000; }
pre { margin: 18px 0; white-space: pre-wrap; word-break: break-word; font: 10px/2.2 'Press Start 2P', Monaco, 'Courier New', monospace; border-left: 3px solid var(--gd); padding-left: 14px; }
.cur { animation: bl 1s steps(1) infinite; }
@keyframes bl { 50% { opacity: 0; } }
</style>
</head>
<body>
<main>
<div class="top"><a class="dim" href="../index.html">&larr; esci dalla modalità admin</a></div>
<div class="cmd"><span class="p">&gt;</span> ADMIN MODE</div>

<a class="f" href="../cestino/index.html"><span class="n">cestino/</span><span class="s">DIR</span></a>
<div class="cmd"><span class="p">&gt;</span><span class="cur">_</span></div>
</main>

</body>
</html>
